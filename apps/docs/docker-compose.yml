name: stackarr-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${STACKARR_DOCS_POSTGRES_USER:-stackarr}
      POSTGRES_PASSWORD: ${STACKARR_DOCS_POSTGRES_PASSWORD:-stackarr}
      POSTGRES_DB: ${STACKARR_DOCS_POSTGRES_DATABASE:-stackarr}
    ports:
      - "127.0.0.1:${STACKARR_DOCS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "20", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${STACKARR_DOCS_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${STACKARR_DOCS_REDIS_TOKEN:-stackarr-local-dev-token}
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "127.0.0.1:${STACKARR_DOCS_REDIS_HTTP_PORT:-58079}:80"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres18-data:
  redis-data:
