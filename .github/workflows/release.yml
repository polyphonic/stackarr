name: Release

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: polyphonic

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

  docker-smoke:
    name: Build release candidate image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-please:
    name: Prepare release
    needs: docker-smoke
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    name: Publish multi-platform images
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64,amd64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            docker.io/polyphonic/stackarr
            ghcr.io/polyphonic/stackarr
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=alpha,enable=${{ contains(needs.release-please.outputs.tag_name, '-alpha.') }}
            type=raw,value=beta,enable=${{ contains(needs.release-please.outputs.tag_name, '-beta.') }}
            type=raw,value=latest,enable=${{ !contains(needs.release-please.outputs.tag_name, '-') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(needs.release-please.outputs.tag_name, '-') }},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},enable=${{ !contains(needs.release-please.outputs.tag_name, '-') }},value=${{ needs.release-please.outputs.tag_name }}
            type=sha,format=long,prefix=sha-

      - name: Build and publish linux/amd64 and linux/arm64 images
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            STACKARR_VERSION=${{ steps.meta.outputs.version }}
            STACKARR_CHANNEL=${{ contains(needs.release-please.outputs.tag_name, '-alpha.') && 'alpha' || contains(needs.release-please.outputs.tag_name, '-beta.') && 'beta' || 'stable' }}
            STACKARR_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published multi-platform manifests
        id: manifests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          HUB_IMAGE="docker.io/polyphonic/stackarr:${VERSION}"
          GHCR_IMAGE="ghcr.io/polyphonic/stackarr:${VERSION}"

          for image in "$HUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools inspect "$image" --raw | jq -e '
              [.manifests[]?.platform
                | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))
                | .architecture]
              | unique
              | length == 2
            ' >/dev/null
          done

          echo "hub_digest=$(docker buildx imagetools inspect "$HUB_IMAGE" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "ghcr_digest=$(docker buildx imagetools inspect "$GHCR_IMAGE" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Append image details to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          HUB_DIGEST: ${{ steps.manifests.outputs.hub_digest }}
          GHCR_DIGEST: ${{ steps.manifests.outputs.ghcr_digest }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > current-notes.md
          cat current-notes.md > release-notes.md
          cat >> release-notes.md <<EOF

          ## Container images

          - Docker Hub: \`docker pull polyphonic/stackarr:${VERSION}\`
          - GitHub Container Registry: \`docker pull ghcr.io/polyphonic/stackarr:${VERSION}\`
          - Docker Hub manifest digest: \`${HUB_DIGEST}\`
          - GHCR manifest digest: \`${GHCR_DIGEST}\`
          - Architectures verified in both registries: \`linux/amd64\`, \`linux/arm64\`
          - Supply-chain metadata: SPDX SBOM and SLSA provenance attached during the Buildx publication

          Pin the digest for the registry you deploy from instead of a moving channel tag.
          EOF
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
