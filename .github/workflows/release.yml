name: Release

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: polyphonic

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

  release-please:
    name: Prepare release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    name: Publish container platforms
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/polyphonic/stackarr
            ghcr.io/polyphonic/stackarr
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=alpha,enable=${{ contains(needs.release-please.outputs.tag_name, '-alpha.') }}
            type=raw,value=beta,enable=${{ contains(needs.release-please.outputs.tag_name, '-beta.') }}
            type=raw,value=latest,enable=${{ !contains(needs.release-please.outputs.tag_name, '-') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(needs.release-please.outputs.tag_name, '-') }},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},enable=${{ !contains(needs.release-please.outputs.tag_name, '-') }},value=${{ needs.release-please.outputs.tag_name }}
            type=sha,format=long,prefix=sha-

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            STACKARR_VERSION=${{ steps.meta.outputs.version }}
            STACKARR_CHANNEL=${{ contains(needs.release-please.outputs.tag_name, '-alpha.') && 'alpha' || contains(needs.release-please.outputs.tag_name, '-beta.') && 'beta' || 'stable' }}
            STACKARR_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Preserve release caches for both architectures while reusing AMD64 PR layers.
          cache-from: |
            type=gha,scope=stackarr-multiplatform
            type=gha,scope=stackarr-amd64
          cache-to: type=gha,mode=max,scope=stackarr-multiplatform
          provenance: mode=max
          sbom: true

      - name: Verify published multi-platform manifests
        id: manifests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          HUB_IMAGE="docker.io/polyphonic/stackarr:${VERSION}"
          GHCR_IMAGE="ghcr.io/polyphonic/stackarr:${VERSION}"
          HUB_SHA_IMAGE="docker.io/polyphonic/stackarr:sha-${REVISION}"
          GHCR_SHA_IMAGE="ghcr.io/polyphonic/stackarr:sha-${REVISION}"

          for image in "$HUB_IMAGE" "$GHCR_IMAGE" "$HUB_SHA_IMAGE" "$GHCR_SHA_IMAGE"; do
            docker buildx imagetools inspect "$image" --raw | jq -e '
              [.manifests[]?.platform
                | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))
                | .architecture]
              | unique
              | length == 2
            ' >/dev/null
          done

          echo "hub_digest=$(docker buildx imagetools inspect "$HUB_IMAGE" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "ghcr_digest=$(docker buildx imagetools inspect "$GHCR_IMAGE" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Append image details to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ github.sha }}
          HUB_DIGEST: ${{ steps.manifests.outputs.hub_digest }}
          GHCR_DIGEST: ${{ steps.manifests.outputs.ghcr_digest }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > current-notes.md
          cat current-notes.md > release-notes.md
          cat >> release-notes.md <<EOF

          ## Container images

          - Docker Hub: \`docker pull polyphonic/stackarr:${VERSION}\`
          - GitHub Container Registry: \`docker pull ghcr.io/polyphonic/stackarr:${VERSION}\`
          - Commit trace tags: \`docker.io/polyphonic/stackarr:sha-${REVISION}\`, \`ghcr.io/polyphonic/stackarr:sha-${REVISION}\`
          - Docker Hub manifest digest: \`${HUB_DIGEST}\`
          - GHCR manifest digest: \`${GHCR_DIGEST}\`
          - Platforms verified in both registries: Linux AMD64 (x86-64) and Linux ARM64 (AArch64)
          - Supply-chain metadata: SPDX SBOM and SLSA provenance attached during the Buildx publication

          Pin the digest for the registry you deploy from instead of a moving channel tag.
          EOF
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
