name: Release

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Recover image publication for the existing current-version release tag'
        type: string
        default: ''
      publish_revision:
        description: 'Full commit SHA of that release tag, required with publish_tag'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: polyphonic

jobs:
  target:
    name: Resolve release target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.target.outputs.revision }}
      tag_name: ${{ steps.target.outputs.tag_name }}
      recover: ${{ steps.target.outputs.recover }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          PUBLISH_REVISION: ${{ inputs.publish_revision }}
        run: node stackarr/scripts/release-target.cjs

  verify:
    name: Verify release candidate
    needs: target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.revision }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Host Portless lifecycle integration requires Node.js 24+.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

  release-please:
    name: Prepare release
    needs: [target, verify]
    if: ${{ needs.target.outputs.recover != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    name: Publish container platforms
    needs: [target, verify, release-please]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.target.outputs.recover == 'true' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.target.outputs.tag_name || needs.release-please.outputs.tag_name }}
      RELEASE_REVISION: ${{ needs.target.outputs.revision }}
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.revision }}
          fetch-depth: 0

      - name: Recheck immutable release target before publishing
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_REVISION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/polyphonic/stackarr
            ghcr.io/polyphonic/stackarr
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_REVISION }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=raw,value=alpha,enable=${{ contains(env.RELEASE_TAG, '-alpha.') }}
            type=raw,value=beta,enable=${{ contains(env.RELEASE_TAG, '-beta.') }}
            type=raw,value=latest
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(env.RELEASE_TAG, '-') }},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},enable=${{ !contains(env.RELEASE_TAG, '-') }},value=${{ env.RELEASE_TAG }}
            type=raw,value=sha-${{ env.RELEASE_REVISION }},priority=100

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            STACKARR_VERSION=${{ steps.meta.outputs.version }}
            STACKARR_CHANNEL=${{ contains(env.RELEASE_TAG, '-alpha.') && 'alpha' || contains(env.RELEASE_TAG, '-beta.') && 'beta' || 'stable' }}
            STACKARR_REVISION=${{ env.RELEASE_REVISION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Preserve release caches for both architectures while reusing AMD64 PR layers.
          cache-from: |
            type=gha,scope=stackarr-multiplatform
            type=gha,scope=stackarr-amd64
          cache-to: type=gha,mode=max,scope=stackarr-multiplatform
          provenance: mode=max
          sbom: true

      - name: Verify published multi-platform manifests
        id: manifests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ env.RELEASE_REVISION }}
          CHANNEL: ${{ contains(env.RELEASE_TAG, '-alpha.') && 'alpha' || contains(env.RELEASE_TAG, '-beta.') && 'beta' || 'stable' }}
        run: |
          bash stackarr/scripts/verify-release-manifests.sh

      - name: Append image details to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ env.RELEASE_REVISION }}
          HUB_DIGEST: ${{ steps.manifests.outputs.hub_digest }}
          GHCR_DIGEST: ${{ steps.manifests.outputs.ghcr_digest }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > current-notes.md
          cat > image-notes.md <<EOF
          <!-- stackarr-container-images:start -->
          ## Container images

          - Docker Hub: \`docker pull polyphonic/stackarr:${VERSION}\`
          - GitHub Container Registry: \`docker pull ghcr.io/polyphonic/stackarr:${VERSION}\`
          - Commit trace tags: \`docker.io/polyphonic/stackarr:sha-${REVISION}\`, \`ghcr.io/polyphonic/stackarr:sha-${REVISION}\`
          - Rolling release stream: \`docker.io/polyphonic/stackarr:latest\`, \`ghcr.io/polyphonic/stackarr:latest\` (includes prereleases; not a stable channel)
          - Docker Hub manifest digest: \`${HUB_DIGEST}\`
          - GHCR manifest digest: \`${GHCR_DIGEST}\`
          - Platforms verified in both registries: Linux AMD64 (x86-64) and Linux ARM64 (AArch64)
          - Supply-chain metadata: SPDX SBOM and SLSA provenance attached during the Buildx publication

          Pin the digest for the registry you deploy from instead of a moving channel tag.
          <!-- stackarr-container-images:end -->
          EOF
          node <<'NODE'
          const fs = require('node:fs');
          const previous = fs.readFileSync('current-notes.md', 'utf8');
          const block = fs.readFileSync('image-notes.md', 'utf8').trim();
          const start = '<!-- stackarr-container-images:start -->';
          const end = '<!-- stackarr-container-images:end -->';
          const starts = previous.split(start).length - 1;
          const ends = previous.split(end).length - 1;
          if (starts !== ends || starts > 1 || (starts && previous.indexOf(start) > previous.indexOf(end))) {
            throw new Error('Ambiguous generated release-note markers');
          }
          const notes = starts
            ? previous.slice(0, previous.indexOf(start)) + block + previous.slice(previous.indexOf(end) + end.length)
            : previous.trimEnd() + '\n\n' + block + '\n';
          fs.writeFileSync('release-notes.md', notes);
          NODE
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
