name: stackarr
version: 0.3.0
description: Stackarr local MCP integration for OpenClaw-compatible agents.
author: Stackarr
transport: mcp-stdio
mcp:
  command: docker
  args:
    - exec
    - -i
    - -e
    - STACKARR_MCP_PROFILE=manage
    - app
    - /app/bin/stackarr
    - mcp
    - serve
  timeout: 120
  connect_timeout: 30
safety:
  local_only: true
  expose_publicly: false
  dangerous_actions_require_confirmation: true
